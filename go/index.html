<body>
<script>
(function () {
  // !!! твоя адреса бекенду на Vercel (без слеша в кінці)
  var BACKEND = "https://diamond-pi-ten.vercel.app";

  function getCookie(n){var m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));return m?m[2]:'';}
  function param(n){return new URLSearchParams(location.search).get(n)||'';}

  function go(){
    var p = new URLSearchParams();
    var fbclid = param('fbclid'); if(fbclid) p.set('fbclid', fbclid);
    var fbp = getCookie('_fbp'); if(fbp) p.set('fbp', fbp);
    var fbc = getCookie('_fbc'); if(fbc) p.set('fbc', fbc);
    ['ad_id','adset_id','campaign_id','campaign_name','ad_name'].forEach(function(k){
      var v = param(k); if(v) p.set(k, v);
    });
    // replace — щоб ця сторінка не лишалась в історії (кнопка "назад" веде в стрічку, не сюди)
    location.replace(BACKEND + '/api/go?' + p.toString());
  }

  // даємо пікселю ~0.4с поставити куки й відправити PageView, потім миттєвий перехід
  setTimeout(go, 400);
})();
</script>
</body>
