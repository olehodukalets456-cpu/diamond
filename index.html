  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { height:100%; background:#060910; }
    body {
      min-height:100%; background:#060910;
      font-family:'Manrope',-apple-system,sans-serif;
      color:#eaf0ff; -webkit-font-smoothing:antialiased;
      overflow-x:hidden; display:flex; justify-content:center;
    }

    /* FLOATING PARTICLES */
    .particle {
      position:fixed;
      pointer-events:none;
      z-index:0;
      will-change:transform;
    }
    .particle img { display:block; width:100%; height:100%; }

    /* GLOW LAYER */
    #glow-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

    .page {
      position:relative; z-index:1; width:100%; max-width:390px;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
    }

    .header {
      position:sticky; top:0; z-index:50; width:100%;
      padding:14px 18px 12px; display:flex; align-items:center;
      background:rgba(6,9,16,0.85);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-bottom:0.5px solid rgba(52,120,246,0.2);
    }
    .hdr-back {
      color:#3478f6; font-size:15px; font-weight:500;
      display:flex; align-items:center; gap:5px; text-decoration:none; flex:1;
    }
    .hdr-center { text-align:center; position:absolute; left:50%; transform:translateX(-50%); }
    .hdr-title { font-size:17px; font-weight:600; color:#fff; white-space:nowrap; }
    .hdr-lock {
      font-size:11px; color:rgba(180,195,240,0.5);
      display:flex; align-items:center; justify-content:center; gap:3px; margin-top:1px;
    }

    .hero {
      width:100%; padding:36px 24px 20px;
      display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
    }
    .avatar-wrap { position:relative; width:108px; height:108px; flex-shrink:0; }
    .avatar-glow {
      position:absolute; inset:-18px; border-radius:50%;
      background:radial-gradient(circle,rgba(52,120,246,0.32) 0%,transparent 70%);
      animation:pulse 3s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.2);opacity:1;}}
    .avatar-ring {
      position:absolute; inset:-4px; border-radius:50%;
      background:conic-gradient(#3478f6 0deg,#0d3fd9 120deg,#062fa0 240deg,#3478f6 360deg);
      animation:spin 4s linear infinite; opacity:0.9;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .avatar-bg { position:absolute; inset:3px; border-radius:50%; background:#0a0e1a; }
    .avatar-img {
      position:absolute; inset:3px; border-radius:50%;
      object-fit:cover; width:calc(100% - 6px); height:calc(100% - 6px);
    }
    .channel-name { font-size:24px; font-weight:800; color:#fff; letter-spacing:-0.4px; line-height:1.15; margin-top:4px; }
    .channel-subs { font-size:15px; color:#8e8e93; font-weight:400; min-height:22px; }
    .channel-desc { font-size:14px; color:rgba(220,230,255,0.65); line-height:1.55; max-width:270px; margin-top:4px; }

    .cta-wrap { width:100%; padding:8px 16px 20px; }
    .btn-main {
      display:block; width:100%; padding:15px; background:#3478f6;
      border:none; border-radius:12px; color:#fff; font-family:'Manrope',sans-serif;
      font-size:17px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none;
      transition:opacity .15s,transform .1s;
      animation:btnGlow 2.5s ease-in-out infinite;
      -webkit-tap-highlight-color:transparent;
    }
    @keyframes btnGlow{
      0%,100%{box-shadow:0 4px 24px rgba(52,120,246,0.55),0 0 50px rgba(52,120,246,0.2);}
      50%{box-shadow:0 4px 32px rgba(52,120,246,0.8),0 0 70px rgba(52,120,246,0.35);}
    }
    .btn-main:active{opacity:.88;transform:scale(0.985);animation:none;}
    .btn-main.done{background:#2db560;animation:none;}

    .divider{width:calc(100% - 32px);height:0.5px;background:rgba(255,255,255,0.07);margin:0 16px;}

    .posts-section{width:100%;padding:18px 16px 30px;}
    .sec-title{font-size:12px;font-weight:600;color:rgba(180,195,240,0.45);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;text-align:left;}
    .posts-list{display:flex;flex-direction:column;gap:1px;background:rgba(52,120,246,0.1);border-radius:14px;overflow:hidden;border:0.5px solid rgba(52,120,246,0.15);}
    .post{background:rgba(10,14,26,0.95);padding:14px 15px;cursor:pointer;text-align:left;transition:background .15s;-webkit-tap-highlight-color:transparent;}
    .post:first-child{border-radius:14px 14px 0 0;}
    .post:last-child{border-radius:0 0 14px 14px;}
    .post:only-child{border-radius:14px;}
    .post:active{background:rgba(52,120,246,0.12);}
    .post-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
    .post-date{font-size:12px;color:rgba(180,195,240,0.45);}
    .post-views{font-size:12px;color:rgba(180,195,240,0.45);}
    .post-text{font-size:14px;color:#eaf0ff;line-height:1.52;}
    .post-tag{display:inline-block;margin-top:8px;font-size:12px;color:#3478f6;font-weight:500;}
    .load-more{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:0.5px solid rgba(52,120,246,0.3);border-radius:12px;color:#3478f6;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;}
    .skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:5px;}
    @keyframes shimmer{to{background-position:-200% 0;}}
  </style>

<script>
const BOT  = '8776864681:AAFwgGtLGCXKvsybqnKKIQGaTF4bGXihoUU';
const CHAN = '@protarget100';
const LINK = 'https://t.me/+WFozZ4sCBYQ2OTgy';
const API  = 'https://api.telegram.org/bot' + BOT;

function trackLead(btn) {
  if(typeof fbq!=='undefined') fbq('track','Lead');
  if(btn){
    const orig=btn.textContent;
    btn.textContent='✓ Открываем Telegram...';
    btn.classList.add('done');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('done');},2500);
  }
}
function openChannel(){trackLead(null);window.open(LINK,'_blank','noopener');}
function fmtSubs(n){return n.toLocaleString('ru-RU')+' подписчиков';}
function fmtDate(u){
  const d=new Date(u*1000),m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return d.getDate()+' '+m[d.getMonth()];
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadSubs(){
  try{
    const r=await fetch(API+'/getChatMembersCount?chat_id='+CHAN);
    const d=await r.json();
    document.getElementById('sub-line').textContent=d.ok?fmtSubs(d.result):'';
  }catch(e){document.getElementById('sub-line').textContent='';}
}
async function loadPosts(){
  try{
    const r=await fetch(API+'/getUpdates?limit=50&allowed_updates=%5B%22channel_post%22%5D');
    const d=await r.json();
    if(d.ok&&d.result){
      const posts=d.result.filter(u=>u.channel_post&&u.channel_post.text&&u.channel_post.text.length>20).slice(-5).reverse();
      if(posts.length){renderPosts(posts.map(u=>u.channel_post));return;}
    }
  }catch(e){}
  renderFallback();
}
function renderPosts(posts){
  document.getElementById('posts-container').innerHTML=
    '<div class="posts-list">'+posts.map(p=>`<div class="post" onclick="openChannel()">
      <div class="post-meta"><span class="post-date">${fmtDate(p.date)}</span>
      ${p.views?`<span class="post-views">&#128065; ${p.views.toLocaleString('ru-RU')}</span>`:''}</div>
      <div class="post-text">${escHtml(p.text.slice(0,200))}${p.text.length>200?'...':''}</div>
    </div>`).join('')+'</div>'+
    `<a class="load-more" href="${LINK}" target="_blank" rel="noopener" onclick="trackLead(null)">Все публикации в канале →</a>`;
}
function renderFallback(){

    el.style.cssText = `
      position:fixed;left:0;top:0;z-index:0;pointer-events:none;
      width:${sz}px;height:${sz}px;
      opacity:${rnd(0.1,0.22).toFixed(2)};
      will-change:transform;
    `;
    document.body.appendChild(el);
    particles.push({
      el, type:'dia',
      x: rnd(0, W()), y: rnd(0, H()),
      sx: rnd(-0.15, 0.15),
      sy: rnd(-0.25, -0.08),
      rot: rnd(0, 360), rs: rnd(-0.2, 0.2),
      w: sz, h: sz
    });
  }

  /* Слова — розкидані по різних кутах, різний нахил */
  const wordInstances = [];
  WORDS.forEach(w => wordInstances.push(w, w)); // по 2 кожного = 10 штук

  wordInstances.forEach((word, i) => {
    const el = document.createElement('div');
    const sz = rnd(10, 16);
    const op = rnd(0.07, 0.13).toFixed(2);
    const tilt = rnd(-35, 35); // різний нахил при спавні
    el.style.cssText = `
      position:fixed;left:0;top:0;z-index:0;pointer-events:none;
      font-family:'Manrope',monospace;font-size:${sz}px;font-weight:700;
      color:rgba(100,190,255,${op});letter-spacing:1.5px;white-space:nowrap;
    `;
    el.textContent = word;
    document.body.appendChild(el);

    // Стартова позиція — рівномірно по екрану (не всі в одному місці)
    const zone = i % 5;
    const startX = (zone / 5) * W() + rnd(0, W()/5);
    const startY = rnd(H()*0.1, H());

    particles.push({
      el, type:'word',
      x: startX, y: startY,
      sx: rnd(-0.12, 0.12),
      sy: rnd(-0.18, -0.06),
      rot: tilt, rs: rnd(-0.03, 0.03),
      w: 60, h: 18
    });
  });

  /* Анімація — дуже плавна */
  let lastTime = 0;
  function tick(now) {
    const dt = Math.min((now - lastTime) / 16.67, 2); // нормалізація до 60fps
    lastTime = now;
    const cw = W(), ch = H();
    for (const p of particles) {
      p.x += p.sx * dt;
      p.y += p.sy * dt;
      p.rot += p.rs * dt;
      if (p.y + p.h < 0) { p.y = ch + p.h; p.x = rnd(0, cw); }
      if (p.x < -120) p.x = cw + 60;
      if (p.x > cw + 120) p.x = -60;
      p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(2)}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* Glow + grid canvas */
  const cv = document.getElementById('glow-canvas');
  const cx = cv.getContext('2d');
  function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  let t = 0;
  function glowFrame(){
    cx.clearRect(0,0,cv.width,cv.height);
    cx.strokeStyle='rgba(52,120,246,0.05)'; cx.lineWidth=0.5;
    for(let x=0;x<cv.width;x+=55){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();}
    for(let y=0;y<cv.height;y+=55){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();}
    const p1=0.08+0.035*Math.sin(t*0.016);
    const g1=cx.createRadialGradient(cv.width/2,0,0,cv.width/2,0,cv.height*0.6);
    g1.addColorStop(0,`rgba(52,120,246,${p1})`);g1.addColorStop(1,'transparent');
    cx.fillStyle=g1;cx.fillRect(0,0,cv.width,cv.height);
    const p2=0.04+0.02*Math.sin(t*0.011+1.5);
    const g2=cx.createRadialGradient(cv.width,cv.height,0,cv.width,cv.height,cv.height*0.5);
    g2.addColorStop(0,`rgba(20,60,200,${p2})`);g2.addColorStop(1,'transparent');
    cx.fillStyle=g2;cx.fillRect(0,0,cv.width,cv.height);
    t++;requestAnimationFrame(glowFrame);
  }
  glowFrame();
})();
</script>
</body>
</html>
